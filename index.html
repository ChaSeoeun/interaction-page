<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little Fox Intro</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>

<body>
    <div class="intro">
        <div class="scene-fit">
            <div class="scene">
                <div class="tv-content">
                    <canvas class="noise"></canvas>
                    <div class="scanline"></div>
                    <div class="rgb"></div>
                    <div class="story">
                        <img src="./images/thum-img-cont01.png" alt="">
                        <video playsinline muted></video>
                    </div>
                    <div class="tv-roll"></div>
                    <p class="library-desc">
                        <img class="library-logo" src="./images/intro-littlefox-logo.png" alt="리틀팍스"><span class="library-copy"> 는<br> 애니메이션 영어 영상과<br> 동화 책(eBook, Printable Book)을<br>마음껏 보고 읽을 수 있는<br> </span><span class="library-slot"><img src="./images/english-story-library-title.png" alt="영어 동화 도서관"></span> <span class="library-copy">입니다.</span>
                    </p>
                    <p class="library-class">매월 진행되는 <span class="library-class-big">CLASS</span> 를 통해<br><span class="library-class-big">듣기, 읽기</span> 뿐만 아니라<br> <span class="library-class-big">말하기, 쓰기</span> 실력까지 키울 수 있습니다.</p>
                    <div class="channel-osd">CH 01</div>
                </div>

                <!-- TV 화면 부분만 투명한 PNG -->
                <img src="./images/room-bg.png" class="room-bg" alt="">
                <div class="remote">
                    <img src="./images/remote-control.png" alt="">
                    <button type="button" class="remote-next" aria-label="다음 채널"></button>
                </div>
            </div>
        </div>

        <div class="fullscreen-noise">
            <canvas class="full-noise-canvas"></canvas>
            <div class="full-scanline"></div>
        </div>

        <div class="power-flash"></div>
        <div class="power-line"></div>
    </div>

    <section class="section01" aria-label="section01"></section>

    <img class="wheel-hint" src="./images/wheel-down.png" alt="마우스 휠을 내려 스크롤하세요">

    <script src="./script.js"></script>
</body>
</html>
